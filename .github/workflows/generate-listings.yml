name: Generate marketplace listings

on:
  # Otomatik çalıştırma kapalı. Gemini/API secret kaynaklı başarısız
  # çalışmalarda gereksiz GitHub bildirimleri oluşmasın.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate listings with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LISTING_COUNT: 8
        run: node scripts/generate-gemini-listings.mjs
      - name: Commit generated listings
        run: |
          git config user.name "alsatkazan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add game/ikinci-el-simsari/js/data/ai-listings.js
          git diff --cached --quiet || git commit -m "chore: refresh AI marketplace listings"
          git push
