name: Deploy İkinci El Simsarı to GitHub Pages

on:
  push:
    branches:
      - claude/friendly-gauss-n7qzyn
    paths:
      - "game/ikinci-el-simsari/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload game
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./game/ikinci-el-simsari

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
