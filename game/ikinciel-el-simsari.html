<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İkinci El Simsarı</title>
<style>
  :root{
    --page:#eef0f2;
    --card:#ffffff;
    --border:#dfe3e7;
    --border-soft:#ececef;
    --ink:#26313d;
    --ink-soft:#6b7683;
    --ink-faint:#9aa4ad;
    --navy:#243447;
    --navy-dark:#182534;
    --orange:#ffb400;
    --orange-dark:#e0980a;
    --link:#0a6ebd;
    --green:#1e8e3e;
    --red:#c62828;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
    box-sizing:border-box;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--page);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    height:100%;
    display:flex;
    flex-direction:column;
  }
  .stamp{ font-family: 'Courier New', ui-monospace, monospace; }
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:4px;
    padding:9px 14px;
    font-size:0.84rem;
    font-weight:700;
  }
  button:disabled{opacity:0.4; cursor:not-allowed;}
  .btn-orange{background:var(--orange); color:#241a00;}
  .btn-orange:hover:not(:disabled){background:var(--orange-dark);}
  .btn-navy{background:var(--navy); color:#fff;}
  .btn-navy:hover:not(:disabled){background:var(--navy-dark);}
  .btn-red{background:var(--red); color:#fff;}
  .btn-ghost{background:#fff; color:var(--ink); border:1.5px solid var(--border); font-weight:600;}
  .btn-ghost:hover:not(:disabled){border-color:var(--ink-soft);}
  .btn-sm{padding:5px 10px; font-size:0.74rem;}

  header{
    background:var(--card);
    color:var(--ink);
    border-bottom:1px solid var(--border);
    flex:0 0 auto;
    padding-top: env(safe-area-inset-top,0px);
  }
  .topbar{ background:var(--navy); color:#cfd8e3; font-size:0.7rem; padding:4px 14px; display:flex; justify-content:space-between; }
  header .titlerow{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 14px 8px; }
  header h1{ margin:0; font-size:1.2rem; letter-spacing:-0.2px; color:var(--navy); font-weight:800; }
  header h1 span{ color:var(--orange-dark); }
  header .tag{ font-size:0.68rem; color:var(--ink-soft); }
  .statbar{ display:flex; gap:0; margin:0 14px 10px; flex-wrap:wrap; font-size:0.78rem; border:1px solid var(--border); border-radius:5px; overflow:hidden; }
  .statbar .stat{ flex:1 1 0; text-align:center; padding:6px 5px; border-right:1px solid var(--border); background:#f8f9fa; }
  .statbar .stat:last-child{ border-right:none; }
  .statbar .lbl{ display:block; color:var(--ink-faint); font-size:0.63rem; text-transform:uppercase; letter-spacing:0.4px; }
  .statbar b{ color:var(--navy); font-size:0.86rem; }
  .statbar b.negv{ color:var(--red); }

  main{
    flex:1 1 auto;
    overflow-y:auto;
    max-width:920px;
    width:100%;
    margin:0 auto;
    padding:12px 12px 90px;
    -webkit-overflow-scrolling:touch;
  }
  @keyframes fadeInMain { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  main.fadein{ animation: fadeInMain 0.22s ease-out; }

  .filterbar{ display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  .filterbar button{ border-radius:16px; padding:7px 14px; font-size:0.78rem; }
  .filterbar button.active{ background:var(--navy); color:#fff; border-color:var(--navy); }

  h2.section{
    font-size:0.92rem; margin:18px 0 9px; padding-bottom:6px;
    border-bottom:2px solid var(--navy);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    color:var(--navy); font-weight:800;
  }
  h2.section .count{ font-size:0.72rem; color:var(--ink-faint); font-weight:normal; }

  /* ---- ilan satır kartı ---- */
  .listrow{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:5px;
    padding:11px;
    margin-bottom:8px;
    display:flex;
    gap:12px;
    align-items:center;
    cursor:pointer;
    transition:box-shadow 0.12s, border-color 0.12s;
  }
  .listrow:hover{ border-color:var(--orange-dark); box-shadow:0 1px 6px rgba(0,0,0,0.08); }
  .thumb{
    width:62px; height:62px; flex:0 0 auto; border-radius:4px;
    display:flex; align-items:center; justify-content:center;
    font-size:1.55rem;
    background:#f1f3f5;
    border:1px solid var(--border);
  }
  .listrow .info{ flex:1 1 auto; min-width:0; }
  .listrow h3{ margin:0 0 3px; font-size:0.92rem; color:var(--link); font-weight:700; }
  .listrow .meta{ font-size:0.74rem; color:var(--ink-soft); }
  .listrow .price{ font-weight:800; color:var(--navy); font-size:0.98rem; white-space:nowrap; }
  .listrow .badge{
    display:inline-block; font-size:0.6rem; padding:2px 6px; border-radius:2px;
    background:var(--navy); color:#fff; margin-left:6px; vertical-align:middle; font-weight:700;
  }
  .listrow .badge.inspected{ background:var(--green); }

  .empty{ color:var(--ink-soft); font-style:italic; padding:18px 0; text-align:center; }

  /* ---- detay overlay ---- */
  @keyframes slideInPanel { from { transform: translateX(100%); } to { transform: translateX(0); } }
  .overlay{
    position:fixed; inset:0; background:var(--page); z-index:40;
    display:flex; flex-direction:column;
    padding-top: env(safe-area-inset-top,0px);
    animation: slideInPanel 0.24s cubic-bezier(.2,.7,.3,1);
  }
  .overlay-header{
    display:flex; align-items:center; gap:10px; padding:11px 14px;
    background:var(--navy); color:#fff; border-bottom:3px solid var(--orange);
    flex:0 0 auto;
  }
  .overlay-header button{ background:rgba(255,255,255,0.12); color:#fff; border:1px solid rgba(255,255,255,0.3); }
  .overlay-body{ flex:1 1 auto; overflow-y:auto; padding:14px; max-width:760px; margin:0 auto; width:100%; -webkit-overflow-scrolling:touch; }
  .hero{
    height:140px; border-radius:5px; margin-bottom:12px;
    display:flex; align-items:center; justify-content:center; font-size:3rem;
    background:#f1f3f5;
    border:1px solid var(--border);
  }
  .detail-title{ font-size:1.15rem; margin:0 0 4px; font-weight:800; color:var(--navy); }
  .detail-price{ font-size:1.4rem; font-weight:800; color:var(--red); margin-bottom:12px; }
  .spec-table{ width:100%; border-collapse:collapse; margin-bottom:14px; font-size:0.83rem; background:var(--card); border:1px solid var(--border); border-radius:5px; overflow:hidden; }
  .spec-table td{ padding:7px 10px; border-bottom:1px solid var(--border-soft); }
  .spec-table tr:last-child td{ border-bottom:none; }
  .spec-table td:first-child{ color:var(--ink-soft); width:42%; background:#f8f9fa; font-weight:600; }
  .desc-box{
    background:var(--card); border:1px solid var(--border); border-radius:5px; padding:12px 14px;
    font-size:0.86rem; line-height:1.55; margin-bottom:6px;
  }
  .desc-note{ font-size:0.7rem; color:var(--ink-faint); font-style:italic; margin-bottom:14px; }
  .fault-list{ list-style:none; margin:8px 0 14px; padding:0; font-size:0.84rem; background:var(--card); border:1px solid var(--border); border-radius:5px; }
  .fault-list li{ padding:7px 10px 7px 22px; border-top:1px solid var(--border-soft); position:relative; }
  .fault-list li:first-child{ border-top:none; }
  .fault-list li:before{ content:"—"; position:absolute; left:8px; color:var(--red); }
  .fault-list li.fixed{ color:var(--green); }
  .fault-list li.fixed:before{ content:"✓"; color:var(--green); }

  .action-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }

  .chatbox{ margin-top:8px; }
  .qbtns{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px; }
  .qbtns button{ background:var(--card); border:1px solid var(--border); color:var(--ink); font-weight:600; border-radius:16px; }
  .qbtns button:hover:not(:disabled){ border-color:var(--orange-dark); }
  .bubble{ max-width:88%; padding:8px 12px; border-radius:10px; margin-bottom:8px; font-size:0.84rem; line-height:1.4; }
  .bubble.me{ background:var(--navy); color:#fff; margin-left:auto; border-bottom-right-radius:2px; }
  .bubble.seller{ background:var(--card); border:1px solid var(--border); margin-right:auto; border-bottom-left-radius:2px; }

  /* ---- garaj / ustalar / defter kartları ---- */
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:11px; }
  .card{ background:var(--card); border:1px solid var(--border); border-radius:5px; padding:12px 14px; cursor:default; }
  .card.click{ cursor:pointer; transition:box-shadow .12s, border-color .12s; }
  .card.click:hover{ border-color:var(--orange-dark); box-shadow:0 1px 6px rgba(0,0,0,0.08); }
  .card h3{ margin:0 0 4px; font-size:0.94rem; color:var(--navy); }
  .card .kicker{ font-size:0.68rem; color:var(--ink-faint); }
  .card .val{ font-weight:800; color:var(--navy); margin:6px 0; }

  .usta-card{ background:var(--card); border:1px solid var(--border); border-radius:5px; padding:12px 14px; margin-bottom:10px; }
  .usta-card h3{ margin:0 0 3px; font-size:0.96rem; color:var(--navy); }
  .usta-card .stats{ font-size:0.78rem; color:var(--ink-soft); margin-bottom:6px; }
  .repair-item{ border-top:1px solid var(--border); padding-top:10px; margin-top:10px; }
  .repair-fault-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; padding:7px 0; border-top:1px dashed var(--border); }
  .repair-fault-row:first-of-type{ border-top:none; }
  .repair-fault-row .flabel{ font-size:0.83rem; flex:1 1 160px; }
  .usta-btns{ display:flex; gap:6px; flex-wrap:wrap; }
  .usta-btns button{ font-size:0.7rem; padding:5px 8px; line-height:1.2; text-align:center; border-radius:4px; }

  .log{ background:var(--card); border:1px solid var(--border); border-radius:5px; padding:10px 14px; font-size:0.81rem; line-height:1.55; }
  .log div{ border-bottom:1px dashed var(--border); padding:4px 0; }
  .log div:last-child{ border-bottom:none; }
  .pos{ color:var(--green); font-weight:700; }
  .neg{ color:var(--red); font-weight:700; }

  .nextday-wrap{ display:flex; justify-content:center; margin:20px 0 6px; }

  /* ---- alt bar ---- */
  nav.bottombar{
    flex:0 0 auto;
    display:flex;
    background:var(--navy);
    border-top:3px solid var(--orange);
    padding-bottom: env(safe-area-inset-bottom,0px);
    position:fixed; left:0; right:0; bottom:0; z-index:30;
  }
  nav.bottombar button{
    flex:1 1 0;
    background:transparent; color:#a9b6c4; border-radius:0;
    padding:9px 4px 7px; font-size:0.64rem; font-weight:600;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    transition: color 0.15s, background 0.15s, border-top 0.15s, padding-top 0.15s;
  }
  nav.bottombar button .ic{ font-size:1.1rem; }
  nav.bottombar button.active{ color:#fff; background:rgba(255,255,255,0.08); border-top:2px solid var(--orange); padding-top:7px; }

  body{ padding-bottom:0; }
  main{ margin-bottom:0; }

  .toast{
    position:fixed; left:50%; bottom:calc(70px + env(safe-area-inset-bottom,0px));
    transform:translateX(-50%);
    background:var(--navy-dark); color:#fff;
    padding:9px 16px; border-radius:5px; font-size:0.83rem;
    opacity:0; pointer-events:none; transition:opacity 0.25s;
    z-index:70; max-width:90%; text-align:center;
  }
  .toast.show{ opacity:1; }

  /* ---- onay modali ---- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(20,26,33,0.55); z-index:80;
    display:flex; align-items:center; justify-content:center; padding:20px;
    animation:fadeInBackdrop 0.15s ease-out;
  }
  @keyframes fadeInBackdrop{ from{opacity:0;} to{opacity:1;} }
  @keyframes popIn{ from{ transform:scale(0.93); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .modal-box{
    background:#fff; border-radius:8px; max-width:360px; width:100%;
    padding:18px 18px 14px; box-shadow:0 10px 40px rgba(0,0,0,0.3);
    animation:popIn 0.16s cubic-bezier(.2,.8,.3,1);
  }
  .modal-box h3{ margin:0 0 8px; font-size:1.02rem; color:var(--navy); }
  .modal-box .mrow{ display:flex; justify-content:space-between; font-size:0.82rem; padding:5px 0; border-bottom:1px dashed var(--border); color:var(--ink-soft); }
  .modal-box .mrow b{ color:var(--ink); }
  .modal-box .mrow:last-of-type{ border-bottom:none; }
  .modal-box .mmsg{ font-size:0.85rem; color:var(--ink); margin:10px 0 12px; line-height:1.45; }
  .modal-actions{ display:flex; gap:8px; margin-top:14px; }
  .modal-actions button{ flex:1 1 0; }

  /* ---- işlem sürüyor barı ---- */
  .busybar{
    position:fixed; left:0; right:0; bottom:0; z-index:75;
    background:var(--navy-dark); color:#fff; padding:9px 16px calc(9px + env(safe-area-inset-bottom,0px));
    font-size:0.78rem; display:flex; align-items:center; gap:10px;
    transform:translateY(100%); transition:transform 0.2s ease-out;
  }
  .busybar.show{ transform:translateY(0); }
  .busybar .spin{
    width:14px; height:14px; border-radius:50%; border:2px solid rgba(255,255,255,0.3); border-top-color:var(--orange);
    animation:spin 0.7s linear infinite; flex:0 0 auto;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .busybar .bblabel{ flex:1 1 auto; }
  .busybar .bbtrack{ position:absolute; left:0; right:0; bottom:0; height:3px; background:rgba(255,255,255,0.15); }
  .busybar .bbfill{ height:100%; background:var(--orange); width:0%; transition:width 0.1s linear; }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --page:#15191d; --card:#1e2328; --border:#333a41; --border-soft:#2a3036; --ink:#e7e9ea; --ink-soft:#9aa4ad; --ink-faint:#727b83;
      --navy:#2a3c52; --navy-dark:#141c26; --orange:#ffb400;
    }
    .listrow h3, .card h3, .usta-card h3, .detail-title{ color:#eaf0f7; }
    .spec-table td:first-child{ background:#242a30; }
    .modal-box{ background:#20262c; }
    .modal-box h3{ color:#eaf0f7; }
  }
</style>
</head>
<body>

<header>
  <div class="topbar"><span>2. el araç · arsa · dükkan ilanları</span><span id="clockline">Gün 1</span></div>
  <div class="titlerow">
    <h1>İkinci El <span>Simsarı</span></h1>
  </div>
  <div class="statbar">
    <div class="stat"><span class="lbl">Kasa</span><b id="balance">0 ₺</b></div>
    <div class="stat"><span class="lbl">Gün</span><b id="day">1</b></div>
    <div class="stat"><span class="lbl">Kâr/Zarar</span><b id="profit">0 ₺</b></div>
    <div class="stat"><span class="lbl">Garaj</span><b id="invcount">0</b></div>
  </div>
</header>

<main id="main"></main>

<nav class="bottombar" id="bottombar">
  <button data-tab="listings"><span class="ic">📋</span>İlanlar</button>
  <button data-tab="garage"><span class="ic">🚗</span>Garaj</button>
  <button data-tab="ustalar"><span class="ic">🔧</span>Usta</button>
  <button data-tab="dukkanlar"><span class="ic">🏪</span>Dükkan</button>
  <button data-tab="mesajlar"><span class="ic">📩</span>Mesaj</button>
  <button data-tab="profil"><span class="ic">👤</span>Profil</button>
</nav>

<div class="toast" id="toast"></div>
<div id="modalRoot"></div>
<div id="busyRoot"></div>

  function fmt(n){ return Math.round(n).toLocaleString('tr-TR') + ' ₺'; }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function uid(){ return uid._n = (uid._n||0) + 1; }

  ];
  var SKILL_LABELS = { tamir:"Tamir Ustalığı", pazarlik:"Pazarlık Ustalığı", ekspertiz:"Ekspertiz Gözü", isletme:"İşletmecilik" };

  var TransactionManager = {

    skillLevel: function(xp){ return clamp(1 + Math.floor(xp/SKILL_XP_PER_LEVEL), 1, 10); },

    // --- Ekspertiz ---
    inspection: function(player, item){
      var lvl = this.skillLevel(player.skills.ekspertiz);
      var discount = clamp(lvl*0.03, 0, 0.4);
      var cost = Math.max(MIN_INSPECT, Math.round(item.askingPrice*INSPECT_RATE*(1-discount)));
      return {
        type:'INSPECT',
        title:'Ekspertiz Yaptır',
        message: item.title + ' için bağımsız ekspertiz raporu istiyorsun.',
        cost: cost,
        durationMs: 1400,
        durationLabel:'≈ 2 saat',
        riskLabel:'Risksiz — rapor her zaman doğru çıkar.',
        confirmLabel:'Ekspertize Gönder'
      };
    },

    // --- Satın alma ---
    purchase: function(player, item){
      var isDukkan = item.category==='dukkan';
      return {
        type:'BUY',
        title: isDukkan ? 'Devren Satın Al' : 'Satın Al',
        message: item.title + ' için satış sözleşmesi imzalanacak.',
        cost: item.askingPrice,
        durationMs: isDukkan ? 2200 : 1200,
        durationLabel: isDukkan ? '≈ 1 gün (devir işlemleri)' : '≈ 3 saat (noter/sözleşme)',
        riskLabel:'Risksiz — fiyat üzerinde anlaşıldı.',
        confirmLabel:'Satın Al, Öde'
      };
    },

    // --- Garajdan / vitrinden satış ---
    sale: function(player, item, viaShop){
      var lvl = this.skillLevel(player.skills[viaShop?'isletme':'pazarlik']);
      var value = item.currentValue();
      var negotiation = viaShop
        ? (0.97 + 0.5*(0.18 + lvl*0.01))
        : (0.9 + 0.5*(0.2 + lvl*0.01));
      var estPrice = Math.round(value*negotiation);
      return {
        type: viaShop ? 'SELL_SHOP' : 'SELL',
        title: 'Satış Yap',
        message: item.title + ' için alıcı ile pazarlık kapanıyor.',
        cost: 0,
        estPrice: estPrice,
        durationMs: viaShop ? 900 : 1300,
        durationLabel: viaShop ? '≈ 1 saat' : '≈ 4 saat (alıcı ile görüşme)',
        riskLabel:'Fiyat, pazarlık becerine göre ' + fmt(Math.round(value*0.9)) + ' – ' + fmt(Math.round(value*1.15)) + ' arası oluşur.',
        confirmLabel:'Satışı Onayla'
      };
    },

    // --- Usta ile tamir ---
    repair: function(player, item, fault, usta, usesPart){
      var cost = Math.round(fault.repairCost * usta.priceMult * (usesPart ? 0.6 : 1));
      var success = clamp(usta.baseSuccess - (fault.heavy ? usta.heavyPenalty : 0), 0.1, 0.99);
      return {
        type:'REPAIR',
        title: usta.name + ' ile Tamir',
        message: item.title + ' üzerindeki "' + fault.label + '" arızası için iş verilecek.',
        cost: cost,
        durationMs: usta.durationMs,
        durationLabel: usta.id==='mahalle' ? '≈ 3 saat' : usta.id==='bilinen' ? '≈ 6 saat' : '≈ 1 gün',
        riskLabel:'Başarı ihtimali %' + Math.round(success*100) + '. Başarısız olursa ücret yine de ödenir.',
        successChance: success,
        confirmLabel:'Ustaya Ver'
      };
    },

    // --- Kendin tamir et ---
    selfRepair: function(player, item, fault){
      var lvl = this.skillLevel(player.skills.tamir);
      var success = clamp(0.35 + lvl*0.06 - (fault.heavy ? 0.25 : 0), 0.15, 0.95);
      return {
        type:'SELF_REPAIR',
        title:'Kendin Yap',
        message: item.title + ' üzerindeki "' + fault.label + '" arızasını kendin tamir edeceksin. İşçilik bedava, sadece parça riske girer.',
        cost: 0,
        durationMs: clamp(1700 - lvl*90, 700, 1700),
        durationLabel:'≈ 5 saat (deneyimine göre değişir)',
        riskLabel:'Başarı ihtimali %' + Math.round(success*100) + '. Başarısız olursan parça harcanır.',
        successChance: success,
        confirmLabel:'Kolları Sıva'

  var ConfirmDialog = {
    root: null,
    init: function(){ this.root = document.getElementById('modalRoot'); },
    ask: function(desc, onConfirm){
      var self = this;
      var backdrop = document.createElement('div');
      backdrop.className = 'modal-backdrop';
      var box = document.createElement('div');
      box.className = 'modal-box';

      var h3 = document.createElement('h3');
      h3.textContent = 'Emin misin? — ' + desc.title;
      box.appendChild(h3);

      var msg = document.createElement('div');
      msg.className = 'mmsg';
      msg.textContent = desc.message;
      box.appendChild(msg);

      function row(label, val){
        var r = document.createElement('div');
        r.className = 'mrow';
        var l = document.createElement('span'); l.textContent = label;
        var v = document.createElement('b'); v.textContent = val;
        r.appendChild(l); r.appendChild(v);
        box.appendChild(r);
      }
      if(desc.cost) row('Ücret', fmt(desc.cost));
      else row('Ücret', 'Ücretsiz');
      if(desc.estPrice) row('Tahmini satış', fmt(desc.estPrice));
      row('Süre', desc.durationLabel || '—');
      if(desc.riskLabel) row('Risk', desc.riskLabel);

      var actions = document.createElement('div');
      actions.className = 'modal-actions';
      var cancel = document.createElement('button');
      cancel.className = 'btn-ghost';
      cancel.textContent = 'Vazgeç';
      cancel.onclick = function(){ self.close(backdrop); };
      var confirm = document.createElement('button');
      confirm.className = desc.danger ? 'btn-red' : 'btn-orange';
      confirm.textContent = desc.confirmLabel || 'Onayla';
      confirm.onclick = function(){ self.close(backdrop); onConfirm(); };
      actions.appendChild(cancel);
      actions.appendChild(confirm);
      box.appendChild(actions);

      backdrop.appendChild(box);
      backdrop.addEventListener('click', function(e){ if(e.target===backdrop) self.close(backdrop); });
      this.root.appendChild(backdrop);
    },
    close: function(backdrop){
      if(backdrop && backdrop.parentNode) backdrop.parentNode.removeChild(backdrop);
    }
  };

  // =====================================================================
  //  İŞLEM SÜRE YÖNETİCİSİ — "işlem sürüyor" durumunu ve gecikmeyi yönetir
  // =====================================================================
  var OperationManager = {
    active: false,
    root: null,
    init: function(){ this.root = document.getElementById('busyRoot'); },
    isBusy: function(){ return this.active; },
    run: function(desc, effectFn){
      if(this.active) return;
      this.active = true;
      var self = this;
      var total = desc.durationMs;
      var startedAt = Date.now();

      var bar = document.createElement('div');
      bar.className = 'busybar';
      var spin = document.createElement('div'); spin.className = 'spin';
      var label = document.createElement('div'); label.className = 'bblabel';
      label.textContent = desc.title + ' işleniyor… (' + (desc.durationLabel||'') + ')';
      var track = document.createElement('div'); track.className = 'bbtrack';
      var fill = document.createElement('div'); fill.className = 'bbfill';
      track.appendChild(fill);
      bar.appendChild(spin); bar.appendChild(label); bar.appendChild(track);
      this.root.innerHTML = '';
      this.root.appendChild(bar);
      requestAnimationFrame(function(){ bar.classList.add('show'); });
      renderBottomBarLock(true);

      var iv = setInterval(function(){
        var pct = clamp((Date.now()-startedAt)/total*100, 0, 100);
        fill.style.width = pct + '%';
      }, 60);

      setTimeout(function(){
        clearInterval(iv);
        bar.classList.remove('show');
        setTimeout(function(){ if(bar.parentNode) bar.parentNode.removeChild(bar); }, 200);
        self.active = false;
        renderBottomBarLock(false);
        effectFn();
      }, total);
    }
  };

  function renderBottomBarLock(locked){
    var nav = document.getElementById('bottombar');
    if(!nav) return;
    nav.style.opacity = locked ? '0.55' : '1';
    nav.style.pointerEvents = locked ? 'none' : 'auto';
  }

  Listing.prototype.specRows = function(){ return []; };

  // =====================================================================
  //  ÜRETİM (market ilanları)
  // =====================================================================
  function makeCar(){
    var year = rnd(2011, 2023);
    var kmBase = (2026 - year) * rnd(9000, 22000);
    var faultCount = Math.random() < 0.18 ? 0 : rnd(1,4);
    var pool = FAULT_POOL_CAR.slice();
    var faults = [];
    for(var i=0;i<faultCount && pool.length>0;i++){
      var idx = Math.floor(Math.random()*pool.length);
      var f = pool.splice(idx,1)[0];
      faults.push({ tag:f.tag, label:f.label, loss:rnd(f.loss[0],f.loss[1]), repairCost:rnd(f.repair[0],f.repair[1]), fixed:false, heavy:false });
    }
    if(Math.random() < 0.10){
      faults.push({ tag:HEAVY_FAULT.tag, label:HEAVY_FAULT.label, loss:rnd(HEAVY_FAULT.loss[0],HEAVY_FAULT.loss[1]), repairCost:rnd(HEAVY_FAULT.repair[0],HEAVY_FAULT.repair[1]), fixed:false, heavy:true });
    }
    var yearFactor = 0.55 + (year-2011) * 0.045;
    var baseValue = Math.round(rnd(170000,260000) * yearFactor);
    var totalLoss = faults.reduce(function(s,f){return s+f.loss;},0);
    var askingBase = baseValue - totalLoss;
    var noise = 0.85 + Math.random()*0.35;
    var askingPrice = Math.max(30000, Math.round(askingBase*noise));

    var shuffled = CAR_AD_PHRASES.slice().sort(function(){return Math.random()-0.5;});
    var carDef = pick(CAR_MODELS);
    return new Car({
      title: year + " " + carDef.brand + " " + carDef.model,
      brand: carDef.brand,
      year: year, km: kmBase, trans: pick(TRANS), fuel: pick(FUEL), body: pick(BODY), color: pick(COLORS),
      location: pick(CITIES),
      description: shuffled[0] + " " + shuffled[1],
      trueValue: baseValue, askingPrice: askingPrice, faults: faults, sellerHonesty: Math.random()
    });
  }

  function makeArsa(){
    var m2 = rnd(150, 2500);
    var pricePerM2 = rnd(400, 2600);
    var baseValue = Math.round(m2*pricePerM2);
    var issueCount = Math.random() < 0.35 ? 0 : rnd(1,3);
    var pool = ARSA_ISSUES_POOL.slice();
    var issues = [];
    for(var i=0;i<issueCount && pool.length>0;i++){
      var idx = Math.floor(Math.random()*pool.length);
      var it = pool.splice(idx,1)[0];
      issues.push({ tag:it.tag, label:it.label, loss:rnd(it.loss[0], it.loss[1]) });
    }
    var totalLoss = issues.reduce(function(s,f){return s+f.loss;},0);
    var askingBase = baseValue - totalLoss;
    var noise = 0.85 + Math.random()*0.35;
    var askingPrice = Math.max(20000, Math.round(askingBase*noise));
    var shuffled = ARSA_AD_PHRASES.slice().sort(function(){return Math.random()-0.5;});
    return new Land({
      title: m2 + " m² " + pick(ARSA_IMAR) + " Arsa",
      m2: m2, imar: pick(ARSA_IMAR), adaParsel: rnd(100,999) + " / " + rnd(1,40),
      location: pick(CITIES),
      description: shuffled[0] + " " + shuffled[1],
      trueValue: baseValue, askingPrice: askingPrice, faults: issues, sellerHonesty: Math.random()
    });
  }

  function makeShop(){
    var st = pick(SHOP_TYPES);
    var shuffled = DUKKAN_AD_PHRASES.slice().sort(function(){return Math.random()-0.5;});
    return new Shop({
      shopType: st.type,
      title: pick(CITIES) + " " + st.title + " — Devren Satılık",
      capacity: rnd(st.capacity[0], st.capacity[1]+1),
      rent: rnd(st.rent[0], st.rent[1]),
      location: pick(CITIES),
      description: shuffled[0] + " " + shuffled[1],
      trueValue: 0, faults: [],
      askingPrice: rnd(st.price[0], st.price[1]),
      accepts: st.accepts
    });
  }

  function Player(){

    this.skills = { tamir:0, pazarlik:0, ekspertiz:0, isletme:0 };
    this.name = 'Simsar';

    this.totalProfit = 0;
  }
  Player.prototype.skillLevel = function(key){ return TransactionManager.skillLevel(this.skills[key]); };
  Player.prototype.addXp = function(key, amount){
    var before = this.skillLevel(key);
    this.skills[key] += amount;
    var after = this.skillLevel(key);
    if(after > before) toast(SKILL_LABELS[key] + ' seviye ' + after + ' oldu!');
  };
  Player.prototype.spend = function(amount){ this.balance -= amount; };
  Player.prototype.earn = function(amount){ this.balance += amount; };
  Player.prototype.canAfford = function(amount){ return this.balance >= amount; };

  // =====================================================================
  //  OYUN DURUMU / DENETLEYİCİ
  // =====================================================================
  var state = {
    day: 1,
    listings: [],
    inventory: [],
    shops: [],
    parts: {},
    partsMarket: [],
    log: [],
    tab: "listings",
    listingFilter: "hepsi",
    openDetailId: null,
    openShopId: null
  };
  var player = new Player();

  function refreshPartsMarket(){
    state.partsMarket = [];
    CAR_MODELS.forEach(function(m){
      PARTS_CATALOG.forEach(function(p){
        state.partsMarket.push({
          brand: m.brand, tag: p.tag, name: p.name,
          price: Math.round(p.basePrice * m.mult * (0.8 + Math.random()*0.5))
        });
      });
    });
  }

  function refreshListings(){
    state.listings = [];
    var carCount = rnd(4,6), arsaCount = rnd(2,3), shopCount = rnd(1,2);
    for(var i=0;i<carCount;i++) state.listings.push(makeCar());
    for(var j=0;j<arsaCount;j++) state.listings.push(makeArsa());
    for(var k=0;k<shopCount;k++) state.listings.push(makeShop());
  }

  function addLog(msg, cls){
    state.log.unshift({msg:msg, cls:cls||""});
    if(state.log.length>50) state.log.pop();
  }

  function toast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ el.classList.remove('show'); }, 1900);
  }

  function findListing(id){ return state.listings.find(function(l){return l.id===id;}); }
  function findInv(id){ return state.inventory.find(function(l){return l.id===id;}); }
  function findAny(id){ return findListing(id) || findInv(id); }

  // ---- genel işlem çalıştırıcı: TransactionManager'dan tanım alır,
  //      onaya sorar, süre bekletir, sonra efekt uygular ----
  function perform(desc, effectFn){
    if(OperationManager.isBusy()) { toast('Önceki işlem bitmeden yeni işlem başlatamazsın.'); return; }
    if(desc.cost && !player.canAfford(desc.cost)){ toast('Bakiye yetersiz.'); return; }
    function go(){ OperationManager.run(desc, effectFn); }
    if(desc.skipConfirm){ go(); } else { ConfirmDialog.ask(desc, go); }
  }

  // =====================================================================
  //  EYLEMLER (Game aksiyonları — TransactionManager tanımlarını kullanır)
  // =====================================================================
  function doInspect(id){
    var item = findAny(id);
    if(!item || item.inspected) return;
    var desc = TransactionManager.inspection(player, item);
    perform(desc, function(){
      player.spend(desc.cost);
      item.inspected = true;
      addLog('Ekspertiz yaptırıldı: ' + item.title + ' — ' + fmt(desc.cost), 'neg');
      player.addXp('ekspertiz', 25);
      render();
    });
  }

  function doBuy(id){
    var item = findListing(id);
    if(!item) return;
    var desc = TransactionManager.purchase(player, item);
    perform(desc, function(){
      var idx = state.listings.findIndex(function(l){return l.id===id;});
      if(idx<0) return;
      state.listings.splice(idx,1);
      player.spend(desc.cost);
      item.owned = true;
      item.purchasePrice = desc.cost;
      if(item.category==='dukkan'){
        state.shops.push(item);
        addLog('Devren satın alındı: ' + item.title + ' — ' + fmt(item.purchasePrice), 'neg');
        toast('Dükkan alındı, Dükkanlarım sekmesinde.');
      } else {
        item.inspected = true;
        item.shopId = null;
        state.inventory.push(item);
        addLog('Satın alındı: ' + item.title + ' — ' + fmt(item.purchasePrice), 'neg');
        toast('Satın alındı, Garajım sekmesinde.');
      }
      state.openDetailId = null;
      render();
    });
  }

  function askQuestion(id, key){
    var item = findAny(id);
    if(!item) return;
    var qList = item.category==='araba' ? CAR_QUESTIONS : ARSA_QUESTIONS;
    var q = qList.find(function(x){return x.key===key;});
    if(!q) return;
    item.messages.push({from:'me', text:q.text});

    var reply;
    if(key==='fiyat'){
      if(item.priceAsked){
        reply = "Zaten son fiyatı söylemiştim: " + fmt(item.askingPrice) + ".";
      } else {
        var pLvl = player.skillLevel('pazarlik');
        var chance = clamp(0.5 + pLvl*0.04, 0.3, 0.9);
        if(Math.random() < chance){
          var disc = clamp((rnd(3,9) + pLvl)/100, 0.02, 0.22);
          item.askingPrice = Math.round(item.askingPrice*(1-disc));
          reply = "Peki, sizin için son fiyat " + fmt(item.askingPrice) + " olsun.";
        } else {
          reply = "Fiyatta esnek değilim, ilandaki fiyat geçerli.";
        }
        item.priceAsked = true;
        player.addXp('pazarlik', 12);
      }
    } else {
      if(item.inspected){
        var present = item.faults.some(function(f){return f.tag===key;});
        reply = present
          ? "Evet, " + item.faults.filter(function(f){return f.tag===key;}).map(function(f){return f.label;}).join(', ') + " mevcut, ekspertizde de çıkmıştır."
          : "Hayır, o konuda bir sorun yok, ekspertiz de temizdir.";
      } else {
        var present2 = item.faults.some(function(f){return f.tag===key;});
        if(present2){
          if(Math.random() < item.sellerHonesty){
            reply = "Açık konuşayım, ufak bir " + (key==='hasar' ? 'kayıt' : key==='motor' ? 'sorun' : key==='boya' ? 'boya işlemi' : key==='tapu' ? 'kayıt' : key==='yol' ? 'durum' : 'husus') + " var ama fiyata yansıttım zaten.";
          } else {
            reply = "Hayır, kesinlikle öyle bir şey yok, çok temiz.";
          }
        } else {
          reply = "Hayır, gayet temiz, o konuda hiç sorun yok.";
        }
      }
    }
    item.messages.push({from:'seller', text:reply});
    render();
  }

  function doRepair(itemId, faultIdx, ustaId){
    var item = findInv(itemId);
    if(!item) return;
    var f = item.faults[faultIdx];
    if(!f || f.fixed) return;
    var usta = USTALAR.find(function(u){return u.id===ustaId;});
    if(!usta) return;
    var partKey = item.brand + '|' + f.tag;
    var usesPart = (state.parts[partKey]||0) > 0;
    var desc = TransactionManager.repair(player, item, f, usta, usesPart);
    perform(desc, function(){
      player.spend(desc.cost);
      if(usesPart) state.parts[partKey] -= 1;
      var ok = Math.random() < desc.successChance;
      if(ok){
        f.fixed = true;
        addLog(usta.name + ' tamir etti: ' + item.title + ' — "' + f.label + '" — ' + fmt(desc.cost) + (usesPart ? ' (kendi parçanla)' : ''), 'neg');
        toast('Tamir başarılı: ' + f.label);
      } else {
        addLog(usta.name + ' işi bitiremedi: ' + item.title + ' — "' + f.label + '" — ' + fmt(desc.cost) + ' (boşa gitti)', 'neg');
        toast('Tamir başarısız oldu, para gitti.');
      }
      player.addXp('tamir', ok ? 10 : 4);
      render();
    });
  }

  function doSelfRepair(itemId, faultIdx){
    var item = findInv(itemId);
    if(!item) return;
    var f = item.faults[faultIdx];
    if(!f || f.fixed) return;
    var partKey = item.brand + '|' + f.tag;
    if((state.parts[partKey]||0) <= 0){ toast('Bu araç markası için parçan yok.'); return; }
    var lvl = player.skillLevel('tamir');
    if(lvl < 3){ toast('Kendin yapabilmek için Tamir Ustalığı en az 3 olmalı.'); return; }
    var desc = TransactionManager.selfRepair(player, item, f);
    perform(desc, function(){
      state.parts[partKey] -= 1;
      var ok = Math.random() < desc.successChance;
      if(ok){
        f.fixed = true;
        addLog('Kendin tamir ettin: ' + item.title + ' — "' + f.label + '" (parça kullanıldı)', 'neg');
        toast('Kendi elinle tamir ettin!');
      } else {
        addLog('Kendin denedin ama olmadı: ' + item.title + ' — "' + f.label + '" (parça harcandı)', 'neg');
        toast('Olmadı, parça boşa gitti ama tecrübe kazandın.');
      }
      player.addXp('tamir', ok ? 20 : 8);
      render();
    });
  }

  function doSell(id){
    var item = findInv(id);
    if(!item) return;
    var desc = TransactionManager.sale(player, item, false);
    perform(desc, function(){
      var idx = state.inventory.findIndex(function(l){return l.id===id;});
      if(idx<0) return;
      var value = item.currentValue();
      var pLvl = player.skillLevel('pazarlik');
      var negotiation = 0.9 + Math.random()*(0.2 + pLvl*0.01);
      var salePrice = Math.round(value*negotiation);
      player.earn(salePrice);
      var profit = salePrice - item.purchasePrice;
      if(item.shopId){
        var sh = state.shops.find(function(s){return s.id===item.shopId;});
        if(sh) sh.slots = sh.slots.filter(function(x){return x!==item.id;});
      }
      state.inventory.splice(idx,1);
      addLog('Satıldı: ' + item.title + ' — ' + fmt(salePrice) + ' (' + (profit>=0?'kâr ':'zarar ') + fmt(Math.abs(profit)) + ')', profit>=0?'pos':'neg');
      player.addXp('pazarlik', 6);
      player.totalSales += 1;
      player.totalProfit += profit;
      state.openDetailId = null;
      render();
    });
  }

  function assignToShop(shopId, itemId){
    var shop = state.shops.find(function(s){return s.id===shopId;});
    var item = findInv(itemId);
    if(!shop || !item) return;
    if(item.category !== shop.accepts){ toast('Bu dükkan bu türü kabul etmiyor.'); return; }
    if(shop.slots.length >= shop.capacity){ toast('Vitrin dolu.'); return; }
    if(item.shopId){ toast('Bu ürün zaten bir vitrinde.'); return; }
    shop.slots.push(item.id);
    item.shopId = shop.id;
    addLog(item.title + ' vitrine kondu: ' + shop.title);
    render();
  }

  function unassignFromShop(shopId, itemId){
    var shop = state.shops.find(function(s){return s.id===shopId;});
    var item = findInv(itemId);
    if(!shop || !item) return;
    shop.slots = shop.slots.filter(function(id){return id!==itemId;});
    item.shopId = null;
    addLog(item.title + ' vitrinden alındı: ' + shop.title);
    render();
  }

  function doSellFromShop(shopId, itemId){
    var shop = state.shops.find(function(s){return s.id===shopId;});
    var item = findInv(itemId);
    if(!shop || !item) return;
    var desc = TransactionManager.sale(player, item, true);
    perform(desc, function(){
      var idx = state.inventory.findIndex(function(l){return l.id===itemId;});
      if(idx<0) return;
      var value = item.currentValue();
      var iLvl = player.skillLevel('isletme');
      var negotiation = 0.97 + Math.random()*(0.18 + iLvl*0.01);
      var salePrice = Math.round(value*negotiation);
      player.earn(salePrice);
      var profit = salePrice - item.purchasePrice;
      shop.slots = shop.slots.filter(function(id){return id!==itemId;});
      state.inventory.splice(idx,1);
      addLog(shop.title + '\'de satıldı: ' + item.title + ' — ' + fmt(salePrice) + ' (' + (profit>=0?'kâr ':'zarar ') + fmt(Math.abs(profit)) + ')', profit>=0?'pos':'neg');
      player.addXp('isletme', 8);
      player.totalSales += 1;
      player.totalProfit += profit;
      render();
    });
  }

  // pasif (otomatik gün sonu) vitrin satışı — onay istemeden, anında
  function passiveShopSell(shopId, itemId){
    var shop = state.shops.find(function(s){return s.id===shopId;});
    var idx = state.inventory.findIndex(function(l){return l.id===itemId;});
    if(!shop || idx<0) return;
    var item = state.inventory[idx];
    var value = item.currentValue();
    var iLvl = player.skillLevel('isletme');
    var negotiation = 0.97 + Math.random()*(0.18 + iLvl*0.01);
    var salePrice = Math.round(value*negotiation);
    player.earn(salePrice);
    var profit = salePrice - item.purchasePrice;
    shop.slots = shop.slots.filter(function(id){return id!==itemId;});
    state.inventory.splice(idx,1);
    addLog(shop.title + '\'de müşteri çıktı: ' + item.title + ' — ' + fmt(salePrice) + ' (' + (profit>=0?'kâr ':'zarar ') + fmt(Math.abs(profit)) + ')', profit>=0?'pos':'neg');
    player.addXp('isletme', 8);
    player.totalSales += 1;
    player.totalProfit += profit;
  }

  function doBuyPart(brand, tag){
    var m = state.partsMarket.find(function(p){return p.brand===brand && p.tag===tag;});
    if(!m) return;
    var desc = TransactionManager.buyPart(player, brand, m);
    perform(desc, function(){
      player.spend(desc.cost);
      var key = brand + '|' + tag;
      state.parts[key] = (state.parts[key]||0) + 1;
      addLog('Yedek parça alındı: ' + brand + ' ' + m.name + ' — ' + fmt(desc.cost), 'neg');
      render();
    });
  }

  function doShopUpgrade(shopId, upgradeId){
    var shop = state.shops.find(function(s){return s.id===shopId;});
    var opt = MASRAF_OPTIONS.find(function(o){return o.id===upgradeId;});
    if(!shop || !opt) return;
    if(shop.upgrades.indexOf(upgradeId) >= 0){ toast('Bu masrafı zaten yaptın.'); return; }
    var desc = TransactionManager.shopUpgrade(player, shop, opt);
    perform(desc, function(){
      player.spend(desc.cost);
      shop.upgrades.push(upgradeId);
      if(upgradeId==='tadilat') shop.capacity += 1;
      else if(upgradeId==='reklam') shop.passiveBonus += 0.05;
      else if(upgradeId==='demirbas') shop.rentMult *= 0.9;
      addLog(shop.title + ' için masraf yapıldı: ' + opt.name + ' — ' + fmt(desc.cost), 'neg');
      toast(opt.name + ' tamamlandı.');
      render();
    });
  }

  function findTenantCandidate(shopId){
    var shop = state.shops.find(function(s){return s.id===shopId;});
    if(!shop) return;
    var businesses = shop.accepts==='araba' ? TENANT_BUSINESS_ARABA : TENANT_BUSINESS_ARSA;
    shop.tenantCandidate = {
      name: pick(TENANT_NAMES), business: pick(businesses),
      offeredRent: Math.round(shop.rent * (1.1 + Math.random()*0.4))
    };
    render();
  }

  function doAcceptTenant(shopId){
    var shop = state.shops.find(function(s){return s.id===shopId;});
    if(!shop || !shop.tenantCandidate) return;
    var desc = TransactionManager.acceptTenant(player, shop);
    perform(desc, function(){
      shop.slots.forEach(function(itemId){
        var item = findInv(itemId);
        if(item) item.shopId = null;
      });
      shop.slots = [];
      shop.tenant = {
        name: shop.tenantCandidate.name, business: shop.tenantCandidate.business,
        rent: shop.tenantCandidate.offeredRent, satisfaction: 70, pendingRequest: null
      };
      shop.mode = 'kiraci';
      shop.tenantCandidate = null;
      addLog(shop.title + ' kiraya verildi: ' + shop.tenant.name + ' (' + shop.tenant.business + '), aylık ' + fmt(shop.tenant.rent), 'pos');
      toast('Kiracı taşındı.');
      render();
    });
  }

  function rejectTenantCandidate(shopId){
    var shop = state.shops.find(function(s){return s.id===shopId;});
    if(!shop) return;
    shop.tenantCandidate = null;
    render();
  }

  function doEvictTenant(shopId){
    var shop = state.shops.find(function(s){return s.id===shopId;});
    if(!shop || !shop.tenant) return;
    var desc = TransactionManager.evictTenant(player, shop);
    perform(desc, function(){
      addLog(shop.title + ' kiracısı tahliye edildi: ' + shop.tenant.name, 'neg');
      shop.tenant = null;
      shop.mode = 'kendim';
      render();
    });
  }

  var TENANT_REQUESTS = [
    { text:"Kira çok yüksek, biraz indirim rica ediyorum.",
      onAccept:function(shop){ shop.tenant.rent = Math.round(shop.tenant.rent*0.9); shop.tenant.satisfaction = clamp(shop.tenant.satisfaction+15,0,100); },
      onReject:function(shop){ shop.tenant.satisfaction = clamp(shop.tenant.satisfaction-10,0,100); } },
    { text:"Tesisatta arıza var, tamiri için 3.000 ₺ rica ediyorum.", cost:3000,
      onAccept:function(shop){ player.spend(3000); shop.tenant.satisfaction = clamp(shop.tenant.satisfaction+10,0,100); },
      onReject:function(shop){ shop.tenant.satisfaction = clamp(shop.tenant.satisfaction-15,0,100); } },
    { text:"Sözleşmeyi uzatmak istiyorum, her şey yolunda, teşekkürler.",
      onAccept:function(shop){ shop.tenant.satisfaction = clamp(shop.tenant.satisfaction+5,0,100); },
      onReject:function(shop){} }
  ];

  function resolveTenantRequest(shopId, accept){
    var shop = state.shops.find(function(s){return s.id===shopId;});
    if(!shop || !shop.tenant || !shop.tenant.pendingRequest) return;
    var req = shop.tenant.pendingRequest;
    if(accept) req.onAccept(shop); else req.onReject(shop);
    addLog(shop.title + ' kiracı talebi ' + (accept?'kabul edildi':'reddedildi') + ': ' + req.text, accept?'neg':'');
    shop.tenant.pendingRequest = null;
    render();
  }

  function doNextDay(){
    var desc = TransactionManager.nextDay(player);
    perform(desc, function(){
      state.day += 1;
      refreshListings();
      refreshPartsMarket();

      var iLvl = player.skillLevel('isletme');
      var rentDiscount = clamp(iLvl*0.02, 0, 0.25);
      var passiveChance = clamp(0.35 + iLvl*0.015, 0.35, 0.6);
      state.shops.forEach(function(shop){
        var rentDue = Math.round(shop.rent * shop.rentMult * (1-rentDiscount));
        player.spend(rentDue);
        addLog(shop.title + ' kirası ödendi: ' + fmt(rentDue), 'neg');
        player.addXp('isletme', 4);

        if(shop.mode==='kendim'){
          shop.slots.slice().forEach(function(itemId){
            if(Math.random() < (passiveChance + shop.passiveBonus)){
              passiveShopSell(shop.id, itemId);
            }
          });
        } else if(shop.mode==='kiraci' && shop.tenant){
          var t = shop.tenant;
          var paysChance = clamp(t.satisfaction/100, 0.5, 0.98);
          if(Math.random() < paysChance){
            player.earn(t.rent);
            addLog(t.name + ' kirasını ödedi: ' + fmt(t.rent), 'pos');
          } else {
            addLog(t.name + ' bu ay kira ödemedi.', 'neg');
            t.satisfaction = clamp(t.satisfaction - 5, 0, 100);
          }
          if(!t.pendingRequest && Math.random() < 0.20){
            t.pendingRequest = pick(TENANT_REQUESTS);
          }
          if(t.satisfaction < 20 && Math.random() < 0.4){
            addLog(t.name + ' sözleşmeyi feshetti ve çıktı: ' + shop.title, 'neg');
            shop.tenant = null;
            shop.mode = 'kendim';
          }
        }
      });
      if(player.balance < 0) addLog('Kasan eksiye düştü, dikkat!', 'neg');
      addLog('— Gün ' + state.day + ' başladı, yeni ilanlar geldi —');
      render();
    });
  }

      var qbtns = document.createElement('div');
      qbtns.className = 'qbtns';
      var qList = item.category==='araba' ? CAR_QUESTIONS : ARSA_QUESTIONS;

        var qb = document.createElement('button');
        qb.className = 'btn-ghost';
        qb.textContent = q.text;

        qbtns.appendChild(qb);
      });
      chatbox.appendChild(qbtns);

      item.messages.forEach(function(m){
        var b = document.createElement('div');

  function renderUstalarTab(container){
    var h2 = document.createElement('h2');
    h2.className = 'section';
    h2.textContent = 'Yedek Parçacı';
    container.appendChild(h2);

    var partsBox = document.createElement('div');
    partsBox.className = 'card';
    partsBox.style.marginBottom = '16px';
    var pdesc = document.createElement('div');
    pdesc.className = 'kicker';
    pdesc.textContent = 'Marka bazlı parça al — kullanınca usta ücretini %40 düşürür ya da yeterli seviyede kendin tamir etmeni sağlar. Fiyatlar her gün değişir.';
    pdesc.style.marginBottom = '8px';
    partsBox.appendChild(pdesc);

    var sel = document.createElement('select');
    sel.style.padding = '6px'; sel.style.marginBottom = '8px'; sel.style.width='100%';
    sel.style.border = '1px solid var(--border)'; sel.style.borderRadius='4px';
    CAR_MODELS.forEach(function(m){
      var opt = document.createElement('option');
      opt.value = m.brand; opt.textContent = m.brand;
      sel.appendChild(opt);
    });
    partsBox.appendChild(sel);

    var partsListWrap = document.createElement('div');
    partsBox.appendChild(partsListWrap);

    function renderPartsForBrand(brand){
      partsListWrap.innerHTML = '';
      state.partsMarket.filter(function(p){return p.brand===brand;}).forEach(function(p){
        var pr = document.createElement('div');
        pr.className = 'repair-fault-row';
        var lbl = document.createElement('div');
        lbl.className = 'flabel';
        var have = state.parts[brand+'|'+p.tag] || 0;
        lbl.textContent = p.name + (have>0 ? ' (elinde ' + have + ')' : '');
        pr.appendChild(lbl);
        var buyBtn = document.createElement('button');
        buyBtn.className = 'btn-ghost btn-sm';
        buyBtn.textContent = fmt(p.price);
        buyBtn.disabled = OperationManager.isBusy() || player.balance < p.price;
        buyBtn.onclick = function(){ doBuyPart(brand, p.tag); };
        pr.appendChild(buyBtn);
        partsListWrap.appendChild(pr);
      });
    }
    sel.onchange = function(){ renderPartsForBrand(sel.value); };
    renderPartsForBrand(sel.value);
    container.appendChild(partsBox);

    var h2b = document.createElement('h2');
    h2b.className = 'section';
    h2b.textContent = 'Ustalar';
    container.appendChild(h2b);

    var repairable = state.inventory.filter(function(i){ return i.category==='araba' && i.faults.some(function(f){return !f.fixed;}); });
    if(repairable.length===0){
      var e = document.createElement('div'); e.className='empty'; e.textContent='Garajında tamir bekleyen araç yok.';
      container.appendChild(e);
      return;
    }

    repairable.forEach(function(item){
      var card = document.createElement('div');
      card.className = 'usta-card';
      var h3 = document.createElement('h3');
      h3.textContent = item.title;
      card.appendChild(h3);

      item.faults.forEach(function(f, fi){
        if(f.fixed) return;
        var block = document.createElement('div');
        block.className = 'repair-item';
        var flabel = document.createElement('div');
        flabel.style.fontWeight = '700'; flabel.style.marginBottom='6px'; flabel.style.fontSize='0.86rem';
        flabel.textContent = f.label + (f.heavy ? ' ⚠️ ağır' : '');
        block.appendChild(flabel);

        var partKey = item.brand + '|' + f.tag;
        var hasPart = (state.parts[partKey]||0) > 0;
        var lvl = player.skillLevel('tamir');

        USTALAR.forEach(function(usta){
          var row = document.createElement('div');
          row.className = 'repair-fault-row';
          var lbl = document.createElement('div');
          lbl.className = 'flabel';
          var cost = Math.round(f.repairCost * usta.priceMult * (hasPart?0.6:1));
          var success = clamp(usta.baseSuccess - (f.heavy?usta.heavyPenalty:0), 0.1, 0.99);
          lbl.textContent = usta.name + ' — ' + fmt(cost) + ' (%' + Math.round(success*100) + ' başarı)' + (hasPart?' [parça indirimi]':'');
          row.appendChild(lbl);
          var btn = document.createElement('button');
          btn.className = 'btn-ghost btn-sm';
          btn.textContent = 'Ver';
          btn.disabled = OperationManager.isBusy() || player.balance < cost;
          btn.onclick = function(){ doRepair(item.id, fi, usta.id); };
          row.appendChild(btn);
          block.appendChild(row);
        });

        if(hasPart && lvl>=3){
          var selfRow = document.createElement('div');
          selfRow.className = 'repair-fault-row';
          var slbl = document.createElement('div');
          slbl.className = 'flabel';
          var ssuccess = clamp(0.35 + lvl*0.06 - (f.heavy?0.25:0), 0.15, 0.95);
          slbl.textContent = 'Kendin Yap — ücretsiz işçilik (%' + Math.round(ssuccess*100) + ' başarı, parça harcanır)';
          selfRow.appendChild(slbl);
          var sbtn = document.createElement('button');
          sbtn.className = 'btn-orange btn-sm';
          sbtn.textContent = 'Kendin Yap';
          sbtn.disabled = OperationManager.isBusy();
          sbtn.onclick = function(){ doSelfRepair(item.id, fi); };
          selfRow.appendChild(sbtn);
          block.appendChild(selfRow);
        } else if(hasPart){
          var hint = document.createElement('div');
          hint.className = 'desc-note';
          hint.style.marginTop='4px';
          hint.textContent = 'Kendin yapabilmek için Tamir Ustalığı en az seviye 3 olmalı (şu an ' + lvl + ').';
          block.appendChild(hint);
        }

        card.appendChild(block);
      });
      container.appendChild(card);
    });
  }

  function renderShopDetail(container, shopId){
    var shop = state.shops.find(function(s){return s.id===shopId;});
    if(!shop){ state.openShopId = null; return; }
    var busy = OperationManager.isBusy();

    var back = document.createElement('button');
    back.className = 'btn-ghost btn-sm';
    back.textContent = '← Dükkanlarım';
    back.style.marginBottom = '10px';
    back.onclick = function(){ state.openShopId = null; render(); };
    container.appendChild(back);

    var h2 = document.createElement('h2');
    h2.className = 'section';
    h2.textContent = shop.title;
    container.appendChild(h2);

    var infoCard = document.createElement('div');
    infoCard.className = 'card';
    infoCard.style.marginBottom = '14px';
    infoCard.innerHTML =
      '<div class="kicker">' + (shop.shopType==='galeri' ? 'Oto Galerisi — araba kabul eder' : 'Emlak Ofisi — arsa kabul eder') + '</div>' +
      '<div style="margin-top:6px;font-size:0.85rem;">Aylık kira: <b>' + fmt(Math.round(shop.rent*shop.rentMult)) + '</b></div>' +
      '<div style="font-size:0.85rem;">Vitrin kapasitesi: <b>' + shop.capacity + '</b></div>';
    container.appendChild(infoCard);

    // ---- Masraflar ----
    var h3m = document.createElement('h2');
    h3m.className = 'section';
    h3m.style.fontSize = '0.84rem';
    h3m.textContent = 'Masraflar';
    container.appendChild(h3m);
    MASRAF_OPTIONS.forEach(function(opt){
      var row = document.createElement('div');
      row.className = 'repair-fault-row';
      var done = shop.upgrades.indexOf(opt.id) >= 0;
      var lbl = document.createElement('div');
      lbl.className = 'flabel';
      lbl.innerHTML = '<b>' + opt.name + '</b><br><span style="color:var(--ink-soft);font-size:0.78rem;">' + opt.desc + '</span>';
      row.appendChild(lbl);
      var btn = document.createElement('button');
      btn.className = 'btn-ghost btn-sm';
      btn.textContent = done ? 'Yapıldı ✓' : fmt(opt.cost);
      btn.disabled = done || busy || player.balance < opt.cost;
      btn.onclick = function(){ doShopUpgrade(shop.id, opt.id); };
      row.appendChild(btn);
      container.appendChild(row);
    });

    // ---- Kiracı ----
    var h3t = document.createElement('h2');
    h3t.className = 'section';
    h3t.style.fontSize = '0.84rem';
    h3t.textContent = 'Kiracı İlişkileri';
    container.appendChild(h3t);

    if(shop.mode==='kiraci' && shop.tenant){
      var t = shop.tenant;
      var tCard = document.createElement('div');
      tCard.className = 'card';
      tCard.innerHTML =
        '<h3>' + t.name + '</h3>' +
        '<div class="kicker">' + t.business + '</div>' +
        '<div style="margin-top:6px;font-size:0.85rem;">Aylık kira: <b>' + fmt(t.rent) + '</b></div>' +
        '<div style="font-size:0.85rem;">Memnuniyet: <b>%' + t.satisfaction + '</b></div>';
      container.appendChild(tCard);

      if(t.pendingRequest){
        var reqCard = document.createElement('div');
        reqCard.className = 'card';
        reqCard.style.marginTop = '8px';
        reqCard.innerHTML = '<b>Kiracı talebi:</b><div style="margin:6px 0;font-size:0.85rem;">' + t.pendingRequest.text + '</div>';
        var reqRow = document.createElement('div');
        reqRow.style.display='flex'; reqRow.style.gap='6px';
        var accBtn = document.createElement('button');
        accBtn.className = 'btn-orange btn-sm'; accBtn.textContent = 'Kabul Et';
        accBtn.onclick = function(){ resolveTenantRequest(shop.id, true); };
        var rejBtn = document.createElement('button');
        rejBtn.className = 'btn-ghost btn-sm'; rejBtn.textContent = 'Reddet';
        rejBtn.onclick = function(){ resolveTenantRequest(shop.id, false); };
        reqRow.appendChild(accBtn); reqRow.appendChild(rejBtn);
        reqCard.appendChild(reqRow);
        container.appendChild(reqCard);
      }

      var evictBtn = document.createElement('button');
      evictBtn.className = 'btn-red btn-sm';
      evictBtn.style.marginTop = '10px';
      evictBtn.textContent = 'Tahliye Et';
      evictBtn.disabled = busy;
      evictBtn.onclick = function(){ doEvictTenant(shop.id); };
      container.appendChild(evictBtn);
    } else {
      if(shop.tenantCandidate){
        var candCard = document.createElement('div');
        candCard.className = 'card';
        candCard.innerHTML =
          '<h3>' + shop.tenantCandidate.name + '</h3>' +
          '<div class="kicker">' + shop.tenantCandidate.business + '</div>' +
          '<div style="margin-top:6px;font-size:0.85rem;">Teklif edilen kira: <b>' + fmt(shop.tenantCandidate.offeredRent) + '</b></div>';
        var cRow = document.createElement('div');
        cRow.style.display='flex'; cRow.style.gap='6px'; cRow.style.marginTop='8px';
        var accBtn2 = document.createElement('button');
        accBtn2.className = 'btn-orange btn-sm'; accBtn2.textContent = 'Kabul Et';
        accBtn2.disabled = busy;
        accBtn2.onclick = function(){ doAcceptTenant(shop.id); };
        var rejBtn2 = document.createElement('button');
        rejBtn2.className = 'btn-ghost btn-sm'; rejBtn2.textContent = 'Reddet';
        rejBtn2.onclick = function(){ rejectTenantCandidate(shop.id); };
        cRow.appendChild(accBtn2); cRow.appendChild(rejBtn2);
        candCard.appendChild(cRow);
        container.appendChild(candCard);
      } else {
        var findBtn = document.createElement('button');
        findBtn.className = 'btn-ghost btn-sm';
        findBtn.textContent = 'Kiracı Ara';
        findBtn.onclick = function(){ findTenantCandidate(shop.id); };
        container.appendChild(findBtn);
      }

      // ---- Vitrin (kendin işletirken) ----
      var h3v = document.createElement('h2');
      h3v.className = 'section';
      h3v.style.fontSize = '0.84rem';
      h3v.textContent = 'Vitrin (' + shop.slots.length + '/' + shop.capacity + ')';
      container.appendChild(h3v);

      if(shop.slots.length===0){
        var ev = document.createElement('div'); ev.className='empty'; ev.textContent='Vitrin boş.';
        container.appendChild(ev);
      } else {
        shop.slots.forEach(function(itemId){
          var item = findInv(itemId);
          if(!item) return;
          var row = document.createElement('div');
          row.className = 'repair-fault-row';
          var lbl = document.createElement('div');
          lbl.className = 'flabel';
          lbl.textContent = item.title + ' — ' + fmt(item.currentValue());
          row.appendChild(lbl);
          var btns = document.createElement('div');
          btns.className = 'usta-btns';
          var sellNow = document.createElement('button');
          sellNow.className = 'btn-orange btn-sm';
          sellNow.textContent = 'Şimdi Sat';
          sellNow.disabled = busy;
          sellNow.onclick = function(){ doSellFromShop(shop.id, item.id); };
          var take = document.createElement('button');
          take.className = 'btn-ghost btn-sm';
          take.textContent = 'Geri Al';
          take.onclick = function(){ unassignFromShop(shop.id, item.id); };
          btns.appendChild(sellNow); btns.appendChild(take);
          row.appendChild(btns);
          container.appendChild(row);
        });
      }

      var candidates = state.inventory.filter(function(i){ return i.category===shop.accepts && !i.shopId; });
      if(candidates.length>0 && shop.slots.length < shop.capacity){
        var addSel = document.createElement('div');
        addSel.style.marginTop = '10px';
        var sel = document.createElement('select');
        sel.style.padding='6px'; sel.style.border='1px solid var(--border)'; sel.style.borderRadius='4px'; sel.style.marginRight='6px';
        candidates.forEach(function(c){
          var opt = document.createElement('option');
          opt.value = c.id; opt.textContent = c.title;
          sel.appendChild(opt);
        });
        var addBtn = document.createElement('button');
        addBtn.className = 'btn-ghost btn-sm';
        addBtn.textContent = 'Vitrine Koy';
        addBtn.onclick = function(){ assignToShop(shop.id, Number(sel.value)); };
        addSel.appendChild(sel); addSel.appendChild(addBtn);
        container.appendChild(addSel);
      }
    }
  }

  function renderMesajlarTab(container){
    var h2 = document.createElement('h2');
    h2.className = 'section';
    h2.textContent = 'Mesajlar';
    container.appendChild(h2);

    var items = [];
    state.listings.concat(state.inventory).forEach(function(l){
      if(l.category!=='dukkan' && l.messages.length>0) items.push({kind:'ilan', item:l});
    });
    state.shops.forEach(function(s){
      if(s.tenant && s.tenant.pendingRequest) items.push({kind:'kiraci', shop:s});
    });

    if(items.length===0){
      var e = document.createElement('div'); e.className='empty'; e.textContent='Hiç mesajın yok.';
      container.appendChild(e);
      return;
    }

    items.forEach(function(entry){
      var row = document.createElement('div');
      row.className = 'listrow';
      var thumb = document.createElement('div');
      thumb.className = 'thumb';
      thumb.textContent = entry.kind==='kiraci' ? '🏪' : entry.item.icon();
      row.appendChild(thumb);
      var info = document.createElement('div');
      info.className = 'info';
      var h3 = document.createElement('h3');
      h3.textContent = entry.kind==='kiraci' ? entry.shop.tenant.name + ' (kiracı)' : entry.item.title;
      info.appendChild(h3);
      var meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = entry.kind==='kiraci' ? entry.shop.tenant.pendingRequest.text : entry.item.messages[entry.item.messages.length-1].text;
      info.appendChild(meta);
      row.appendChild(info);
      row.onclick = function(){
        if(entry.kind==='kiraci'){ state.tab='dukkanlar'; state.openShopId = entry.shop.id; }
        else { state.openDetailId = entry.item.id; }
        render();
      };
      container.appendChild(row);
    });
  }

    container.appendChild(grid);

    var h2c = document.createElement('h2');
    h2c.className = 'section';
    h2c.textContent = 'İşlem Defteri';
    container.appendChild(h2c);
    var log = document.createElement('div');
    log.className = 'log';
    if(state.log.length===0){
      log.innerHTML = '<div>Henüz işlem yok.</div>';
    } else {
      state.log.forEach(function(l){
        var d = document.createElement('div');
        if(l.cls) d.className = l.cls;
        d.textContent = l.msg;
        log.appendChild(d);
      });
    }
    container.appendChild(log);
  }

  // =====================================================================
  //  ANA RENDER
  // =====================================================================
  function updateHeader(){
    document.getElementById('balance').textContent = fmt(player.balance);
    document.getElementById('balance').className = player.balance<0 ? 'negv' : '';
    document.getElementById('day').textContent = state.day;
    var profit = player.balance - player.startBalance;
    var profitEl = document.getElementById('profit');
    profitEl.textContent = fmt(profit);
    profitEl.className = profit<0 ? 'negv' : '';
    document.getElementById('invcount').textContent = state.inventory.length;
    document.getElementById('clockline').textContent = 'Gün ' + state.day;
  }

  function render(){
    updateHeader();

    document.querySelectorAll('#bottombar button').forEach(function(b){
      b.classList.toggle('active', b.dataset.tab===state.tab);
    });

    var main = document.getElementById('main');
    main.innerHTML = '';
    main.classList.remove('fadein');
    void main.offsetWidth;
    main.classList.add('fadein');

    if(state.tab==='listings') renderListingsTab(main);
    else if(state.tab==='garage') renderGarageTab(main);
    else if(state.tab==='ustalar') renderUstalarTab(main);
    else if(state.tab==='dukkanlar') renderDukkanlarTab(main);
    else if(state.tab==='mesajlar') renderMesajlarTab(main);
    else if(state.tab==='profil') renderProfilTab(main);

    var existingOverlay = document.querySelector('.overlay');
    if(existingOverlay) existingOverlay.remove();
    if(state.openDetailId){
      var ov = renderDetailOverlay();
      if(ov) document.body.appendChild(ov);
      else state.openDetailId = null;
    }
  }

  // =====================================================================
  //  BAŞLAT
  // =====================================================================
  document.querySelectorAll('#bottombar button').forEach(function(b){
    b.onclick = function(){
      if(OperationManager.isBusy()){ toast('İşlem sürerken sekme değiştiremezsin.'); return; }
      state.tab = b.dataset.tab;
      state.openShopId = null;
      state.openDetailId = null;
      render();
    };
  });

  ConfirmDialog.init();
  OperationManager.init();
  refreshListings();
  refreshPartsMarket();
  addLog('Simsarlığa hoş geldin. Kasanla ilan al, incele, tamir ettir, kârına sat.');
  render();

})();
</script>
</body>
</html>
